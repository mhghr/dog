name: monitoring-local-infra

services:
  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --port
      - "6379"
    ports:
      - "0.0.0.0:6380:6379"
    volumes:
      - redis_local_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.115.0
    command:
      - -storageDataPath=/victoria-metrics-data
      - -retentionPeriod=30d
    ports:
      - "0.0.0.0:8428:8428"
    volumes:
      - victoria_local_data:/victoria-metrics-data
    restart: unless-stopped

  migrate:
    image: migrate/migrate:latest
    profiles: ["tools"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://postgres:123@host.docker.internal:5432/datadog?sslmode=disable
      - up

volumes:
  redis_local_data:
  victoria_local_data:
