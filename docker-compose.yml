services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: monitoring
      POSTGRES_USER: monitoring
      POSTGRES_PASSWORD: monitoring
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U monitoring -d monitoring
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.115.0
    command:
      - -storageDataPath=/victoria-metrics-data
      - -retentionPeriod=30d
    ports:
      - "8428:8428"
    volumes:
      - victoria_data:/victoria-metrics-data

  nats:
    image: nats:2.11-alpine
    command:
      - -js
      - -m
      - "8222"
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://localhost:8222/healthz >/dev/null 2>&1 || exit 1
      interval: 5s
      timeout: 3s
      retries: 10

  otel-ingest:
    build:
      context: .
      dockerfile: deployments/Dockerfile.otel-ingest
    environment:
      OTEL_INGEST_ADDRESS: :4318
      DATABASE_URL: postgres://monitoring:monitoring@postgres:5432/monitoring?sslmode=disable
      NATS_URL: nats://nats:4222
      AGENT_SECRET_ENCRYPTION_KEY: ${AGENT_SECRET_ENCRYPTION_KEY:-dev-insecure-agent-secret-key-change-me}
      LOG_LEVEL: info
      LOG_FORMAT: json
    ports:
      - "4318:4318"
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy

  metric-processor:
    build:
      context: .
      dockerfile: deployments/Dockerfile.metric-processor
    environment:
      NATS_URL: nats://nats:4222
      VICTORIA_URL: http://victoriametrics:8428
      WORKER_COUNT: "4"
      LOG_LEVEL: info
      LOG_FORMAT: json
    depends_on:
      nats:
        condition: service_healthy
      victoriametrics:
        condition: service_started

  migrate:
    image: migrate/migrate:latest
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    command:
      - -path=/migrations
      - -database=postgres://monitoring:monitoring@postgres:5432/monitoring?sslmode=disable
      - up
    restart: "no"

  api:
    build:
      context: .
      dockerfile: deployments/Dockerfile.api
    environment:
      APP_ENV: development
      HTTP_ADDRESS: :8080
      DATABASE_URL: postgres://monitoring:monitoring@postgres:5432/monitoring?sslmode=disable
      REDIS_ADDRESS: redis:6379
      VICTORIA_URL: http://victoriametrics:8428
      AGENT_SECRET_ENCRYPTION_KEY: ${AGENT_SECRET_ENCRYPTION_KEY:-dev-insecure-agent-secret-key-change-me}
      WORKER_TOKEN: local-worker-token
      CORS_ALLOWED_ORIGINS: http://localhost:2000,http://localhost:3000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:2000/api/auth/callback/google}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-dev-insecure-jwt-secret-change-me}
      AUTH_COOKIE_SECURE: "false"
      OTP_DEV_MODE: "true"
      LOG_FORMAT: json
    ports:
      - "5000:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /api
        - healthcheck
      interval: 10s
      timeout: 3s
      retries: 5

  scheduler:
    build:
      context: .
      dockerfile: deployments/Dockerfile.scheduler
    environment:
      DATABASE_URL: postgres://monitoring:monitoring@postgres:5432/monitoring?sslmode=disable
      REDIS_ADDRESS: redis:6379
      HEALTH_ADDRESS: :8081
      PROBE_LOCATION_CODE: local-dev
      SCHEDULER_BATCH_SIZE: "100"
      SCHEDULER_INTERVAL: 1s
      LOG_FORMAT: json
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /scheduler
        - healthcheck
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: deployments/Dockerfile.worker
    environment:
      REDIS_ADDRESS: redis:6379
      HEALTH_ADDRESS: :8081
      API_BASE_URL: http://api:8080
      WORKER_TOKEN: local-worker-token
      WORKER_NAME: worker-local-01
      WORKER_CONCURRENCY: "8"
      # Local development: allow probing private/compose-internal targets.
      # MUST be false for any deployment that accepts user-defined targets.
      SSRF_ALLOW_PRIVATE: "true"
      PING_PRIVILEGED: "true"
      LOG_FORMAT: json
    cap_add:
      - NET_RAW
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - /worker
        - healthcheck
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
      API_INTERNAL_URL: http://api:8080
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:2000/api/auth/callback/google}
    ports:
      - "2000:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  victoria_data:
