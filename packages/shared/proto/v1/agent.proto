syntax = "proto3";

package agent.v1;

option go_package = "monitoring-platform/proto/agent/v1;agentv1";

service AgentGateway {
    rpc Connect(stream AgentMessage) returns (stream GatewayMessage);
}

message AgentMessage {
    oneof payload {
        AgentHello hello = 1;
        AgentHeartbeat heartbeat = 2;
        JobAccepted job_accepted = 3;
        ProbeResultBatch result_batch = 4;
    }
}

message GatewayMessage {
    oneof payload {
        ProbeJob job = 1;
        ResultStored result_stored = 2;
        CancelJob cancel_job = 3;
        ConfigurationChanged config_changed = 4;
        DrainAgent drain = 5;
    }
}

message AgentHello {
    string agent_id = 1;
    string version = 2;
    string hostname = 3;
    repeated string capabilities = 4;
    int32 max_concurrency = 5;
}

message AgentHeartbeat {
    int64 sent_at_unix_ms = 1;
    int32 running_jobs = 2;
    int32 available_slots = 3;
    int64 spool_bytes = 4;
}

message ProbeJob {
    string job_id = 1;
    string lease_id = 2;
    string monitor_id = 3;
    string monitor_type = 4;
    string target = 5;
    string probe_location_id = 6;
    int64 scheduled_at_unix_ms = 7;
    int64 deadline_unix_ms = 8;
    int32 timeout_millis = 9;
    int32 retries = 10;
    int32 attempt = 11;
    string config_version = 12;
    bytes config_json = 13;
}

message JobAccepted {
    string job_id = 1;
    string lease_id = 2;
}

message ProbeResult {
    string result_id = 1;
    string job_id = 2;
    string lease_id = 3;
    string monitor_id = 4;
    string probe_location_id = 5;
    int32 attempt = 6;
    bool success = 7;
    string status = 8;
    string error_code = 9;
    string error_message = 10;
    int64 duration_millis = 11;
    int64 started_at_unix_ms = 12;
    int64 finished_at_unix_ms = 13;
    bytes metrics_json = 14;
    bytes attributes_json = 15;
}

message ProbeResultBatch {
    repeated ProbeResult results = 1;
}

message ResultStored {
    repeated string result_ids = 1;
}

message CancelJob {
    string job_id = 1;
    string lease_id = 2;
    string reason = 3;
}

message ConfigurationChanged {
    string config_version = 1;
    bytes config_json = 2;
}

message DrainAgent {
    string reason = 1;
    int64 deadline_unix_ms = 2;
}
